<!-- ======================================================================
@partial: desktop-stage
@node: gen-desktop-stage (root)
@desc: 桌面舞台共享片段 —— 五个页面共用的"Windows 桌面"语境层。
       三层结构：壁纸底层 → 桌面语境中层（快捷图标列 + 任务栏）→ 挂件顶层插槽。
       颜色只允许 var(--apple-*) 语义 token 或其 color-mix 派生，禁止硬编码色值。
@mutableSlots: whaleDock / overlayLayer / trayActiveState
======================================================================= -->

<!-- @region: stage-spacing-scale / stage-typography-scale
     舞台尺度与字号阶梯：全部以 --spacing(0.24rem) 为基数派生，
     保证五页的挂件位置、任务栏几何零漂移。 -->
<style id="stage-critical-layout">
  /* ---- 基座覆写：component-vars 内组件预览的 body{padding:12px} 会污染全幅舞台，必须压回 ---- */
  body { margin: 0; padding: 0; }

  /* ---- @region: desktop-stage-root-frame ---- */
  .desktop-stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 640px;
    overflow: hidden;
    background: var(--apple-background);
    font-family: var(--font-sans);
    color: var(--apple-foreground);
  }

  /* ---- @region: desktop-wallpaper-layer ---- */
  .desktop-wallpaper {
    position: absolute;
    inset: 0;
    background-image: url("../assets/desktop-wallpaper.png");
    background-size: cover;
    background-position: center;
  }
  /* 深海 vignette：压暗四角，让玻璃浮层获得可信的折射源 */
  .desktop-wallpaper::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 90% at 72% 30%, transparent 55%, color-mix(in srgb, var(--apple-background) 42%, transparent) 100%);
  }

  /* ---- @region: desktop-shortcut-column ----
     桌面语境道具：低存在感，不抢挂件焦点 */
  .desktop-shortcuts {
    position: absolute;
    top: calc(var(--spacing) * 6);
    left: calc(var(--spacing) * 6);
    display: flex;
    flex-direction: column;
    gap: calc(var(--spacing) * 3);
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .desktop-shortcut {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(var(--spacing) * 1.5);
    width: 76px;
    padding: calc(var(--spacing) * 2) 0;
    border-radius: calc(var(--radius) * 0.75);
    color: var(--apple-foreground);
    opacity: 0.6;
  }
  .desktop-shortcut .sc-icon {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--apple-background) 65%, transparent));
  }
  .desktop-shortcut .sc-icon [data-icon] { width: 28px; height: 28px; }
  .desktop-shortcut .sc-label {
    font-size: 11px;
    line-height: 1.2;
    text-shadow: 0 1px 2px color-mix(in srgb, var(--apple-background) 70%, transparent);
  }

  /* ---- @region: taskbar-chrome ----
     居中悬浮玻璃任务栏：Windows 语境 + Apple 毛玻璃质感 */
  .taskbar-chrome {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none; /* 语境层不拦截挂件交互 */
  }
  .taskbar-pill {
    display: flex;
    align-items: center;
    gap: calc(var(--spacing) * 1.5);
    height: 40px;
    padding: 0 calc(var(--spacing) * 2.5);
    pointer-events: auto;
  }
  .taskbar-app {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border-radius: calc(var(--radius) * 0.6);
    color: var(--apple-foreground);
    opacity: 0.78;
  }
  .taskbar-app [data-icon] { width: 19px; height: 19px; }
  .taskbar-app[data-active="true"] {
    background: color-mix(in srgb, var(--apple-secondary) 85%, transparent);
    opacity: 1;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--apple-border) 60%, transparent);
  }

  /* ---- @region: tray-cluster ----
     @slot: trayActiveState —— 有且仅有一个 tray 项带 data-active="true" */
  .tray-cluster {
    position: absolute;
    right: calc(var(--spacing) * 3);
    bottom: 6px;
    height: 36px;
    display: flex;
    align-items: center;
    gap: calc(var(--spacing) * 2.5);
    padding: 0 calc(var(--spacing) * 3);
    font-size: 11px;
    line-height: 1.25;
    color: var(--apple-foreground);
    pointer-events: auto;
  }
  .tray-item {
    display: inline-flex;
    align-items: center;
    gap: calc(var(--spacing) * 1.5);
    opacity: 0.78;
  }
  .tray-item[data-active="true"] { opacity: 1; }
  .tray-item [data-icon] { width: 14px; height: 14px; }
  .tray-time {
    text-align: right;
    font-variant-numeric: tabular-nums;
    opacity: 0.9;
  }

  /* ---- @slot: whaleDock 锚位 ----
     右下偏上，贴真实桌宠习惯位置；各页只换内容，不改几何 */
  .whale-dock-slot {
    position: absolute;
    right: calc(var(--spacing) * 12);
    bottom: calc(48px + var(--spacing) * 4);
    width: 300px;
    height: 470px;
  }

  /* ---- @slot: overlayLayer ----
     浮层相对挂件锚点定位；scrim 类元素用 position:fixed 覆盖整台舞台 */
  .stage-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .stage-overlay > * { pointer-events: auto; }
</style>

<!-- @region: desktop-stage-root-frame -->
<main class="desktop-stage" data-stage="dsweber-desktop-pet">

  <!-- @region: desktop-wallpaper-layer -->
  <div class="desktop-wallpaper" aria-hidden="true"></div>

  <!-- @region: desktop-shortcut-column -->
  <ul class="desktop-shortcuts" aria-label="桌面快捷方式">
    <li class="desktop-shortcut">
      <span class="sc-icon"><span data-icon style="-webkit-mask-image: url('../assets/icons/dl_builtin_apple/folder.svg'); mask-image: url('../assets/icons/dl_builtin_apple/folder.svg');"></span></span>
      <span class="sc-label">项目文件夹</span>
    </li>
    <li class="desktop-shortcut">
      <span class="sc-icon"><span data-icon style="-webkit-mask-image: url('../assets/icons/dl_builtin_apple/file.svg'); mask-image: url('../assets/icons/dl_builtin_apple/file.svg');"></span></span>
      <span class="sc-label">设计文档</span>
    </li>
    <li class="desktop-shortcut">
      <span class="sc-icon"><span data-icon style="-webkit-mask-image: url('../assets/icons/dl_builtin_apple/trash-2.svg'); mask-image: url('../assets/icons/dl_builtin_apple/trash-2.svg');"></span></span>
      <span class="sc-label">回收站</span>
    </li>
  </ul>

  <!-- @region: taskbar-chrome -->
  <div class="taskbar-chrome" aria-hidden="true">
    <div class="taskbar-pill glass-surface glass-capsule">
      <span class="taskbar-app"><span data-icon style="-webkit-mask-image: url('../assets/icons/dl_builtin_apple/house.svg'); mask-image: url('../assets/icons/dl_builtin_apple/house.svg');"></span></span>
      <span class="taskbar-app"><span data-icon style="-webkit-mask-image: url('../assets/icons/dl_builtin_apple/folder-open.svg'); mask-image: url('../assets/icons/dl_builtin_apple/folder-open.svg');"></span></span>
      <span class="taskbar-app" data-active="true"><span data-icon style="-webkit-mask-image: url('../assets/icons/dl_builtin_apple/send-horizontal.svg'); mask-image: url('../assets/icons/dl_builtin_apple/send-horizontal.svg');"></span></span>
      <span class="taskbar-app"><span data-icon style="-webkit-mask-image: url('../assets/icons/dl_builtin_apple/user.svg'); mask-image: url('../assets/icons/dl_builtin_apple/user.svg');"></span></span>
    </div>
  </div>

  <!-- @region: tray-cluster / @slot: trayActiveState -->
  <div class="tray-cluster glass-surface glass-capsule" aria-hidden="true">
    <span class="tray-item"><span data-icon style="-webkit-mask-image: url('../assets/icons/dl_builtin_apple/chevron-up.svg'); mask-image: url('../assets/icons/dl_builtin_apple/chevron-up.svg');"></span></span>
    <span class="tray-item" data-active="true">
      <span data-icon style="-webkit-mask-image: url('../assets/icons/dl_builtin_apple/circle-check.svg'); mask-image: url('../assets/icons/dl_builtin_apple/circle-check.svg');"></span>
      <span>已连接</span>
    </span>
    <span class="tray-time">21:30<br>2026/9/20</span>
  </div>

  <!-- @slot: whaleDock —— 由 partials/whale-dock.html 填充 -->
  <div class="whale-dock-slot" data-slot="whaleDock"><!-- @slot: whaleDock --></div>

  <!-- @slot: overlayLayer —— 派生页在此注入菜单/气泡/面板 -->
  <div class="stage-overlay" data-slot="overlayLayer"><!-- @slot: overlayLayer --></div>

</main>
