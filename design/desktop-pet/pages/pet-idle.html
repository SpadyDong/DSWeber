 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  
  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #0f172a);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #111827);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--card));
  --apple-muted-foreground: var(--muted-foreground, var(--foreground));
  --apple-accent: var(--accent, var(--secondary, var(--muted, var(--card))));

  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, currentColor);
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --apple-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --apple-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));

  --text-200: #c7c7cc;

  /* icon */

  --accent-foreground: var(--text-800);

  --success-foreground: var(--state-success-foreground);

  --input: var(--background-400);
  --ring: var(--brand-500);

  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);

  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;

  --font-mono: JetBrains Mono, monospace;

  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {

      <style id="critical-layout">
        /* ---- 基座覆写：component-vars 组件预览的 body{padding:12px} 会污染全幅舞台 ---- */
        body { margin: 0; padding: 0; }

        /* ========== desktop-stage ========== */
        .desktop-stage {
          position: relative; width: 100vw; height: 100vh; min-height: 640px;
          overflow: hidden; background: var(--apple-background);
          font-family: var(--font-sans); color: var(--apple-foreground);
        }
        .desktop-wallpaper {
          position: absolute; inset: 0;
          background-image: url("../assets/desktop-wallpaper.png");
          background-size: cover; background-position: center;
        }
        .desktop-wallpaper::after {
          content: ""; position: absolute; inset: 0;
          background: radial-gradient(120% 90% at 72% 30%, transparent 55%, color-mix(in srgb, var(--apple-background) 42%, transparent) 100%);
        }
        .desktop-shortcuts {
          position: absolute; top: calc(var(--spacing) * 6); left: calc(var(--spacing) * 6);
          display: flex; flex-direction: column; gap: calc(var(--spacing) * 3);
          margin: 0; padding: 0; list-style: none;
        }
        .desktop-shortcut {
          display: flex; flex-direction: column; align-items: center;
          gap: calc(var(--spacing) * 1.5); width: 76px;
          padding: calc(var(--spacing) * 2) 0;
          border-radius: calc(var(--radius) * 0.75);
          color: var(--apple-foreground); opacity: 0.6;
        }
        .desktop-shortcut .sc-icon {
          width: 34px; height: 34px; display: grid; place-items: center;
          filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--apple-background) 65%, transparent));
        }
        .desktop-shortcut .sc-icon [data-icon] { width: 28px; height: 28px; }
        .desktop-shortcut .sc-label {
          font-size: 11px; line-height: 1.2;
          text-shadow: 0 1px 2px color-mix(in srgb, var(--apple-background) 70%, transparent);
        }
        .taskbar-chrome {
          position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
          display: flex; align-items: center; justify-content: center;
          pointer-events: none;
        }
        .taskbar-pill {
          display: flex; align-items: center; gap: calc(var(--spacing) * 1.5);
          height: 40px; padding: 0 calc(var(--spacing) * 2.5); pointer-events: auto;
        }
        .taskbar-app {
          width: 30px; height: 30px; display: grid; place-items: center;
          border-radius: calc(var(--radius) * 0.6);
          color: var(--apple-foreground); opacity: 0.78;

        .glass-surface {

        .glass-panel-shell {
          display: flex; flex-direction: column; gap: calc(var(--spacing) * 4);
          padding: calc(var(--spacing) * 6);
        }
        .glass-panel-title { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: 0.01em; }
        .glass-panel-body {
          display: flex; flex-direction: column; gap: calc(var(--spacing) * 4);
          font-size: 13px; color: var(--apple-muted-foreground);
        }
        .glass-panel-footer {
          display: flex; align-items: center; justify-content: flex-end; gap: calc(var(--spacing) * 2.5);
        }
        .glass-bubble-shell {
          position: relative; display: flex; flex-direction: column; align-items: center;
          gap: calc(var(--spacing) * 3);
          padding: calc(var(--spacing) * 5) calc(var(--spacing) * 5) calc(var(--spacing) * 4);
          text-align: center;
        }
        .glass-bubble-shell::after {
          content: ""; position: absolute; left: 50%; bottom: -7px;
          width: 14px; height: 14px; transform: translateX(-50%) rotate(45deg);
          background: color-mix(in srgb, var(--apple-popover) 66%, transparent);
          border-right: 1px solid color-mix(in srgb, var(--apple-border) 62%, transparent);
          border-bottom: 1px solid color-mix(in srgb, var(--apple-border) 62%, transparent);
        }
        .glass-menu-shell {
          display: flex; flex-direction: column; gap: calc(var(--spacing) * 1);
          padding: calc(var(--spacing) * 1.5);
        }
        .glass-menu-item {
          display: flex; align-items: center; gap: calc(var(--spacing) * 2.5);
          height: 40px; padding: 0 calc(var(--spacing) * 2.5) 0 calc(var(--spacing) * 1.5);
          border-radius: 999px; color: var(--apple-foreground); text-decoration: none;
          font-size: 13px; font-weight: 600; cursor: pointer;
          transition: background-color 0.16s ease, color 0.16s ease, transform 0.16s ease;
        }
        .glass-menu-item:hover, .glass-menu-item:focus-visible {
          background: var(--apple-primary); color: var(--apple-primary-foreground); outline: none;
        }
        .glass-menu-item:active { transform: scale(0.97); }
        .glass-menu-item .mi-icon {
          flex: none; width: 26px; height: 26px; display: grid; place-items: center;
          border-radius: 999px;
          background: color-mix(in srgb, var(--apple-secondary) 72%, transparent);
          transition: background-color 0.16s ease;
        }
        .glass-menu-item .mi-icon [data-icon], .glass-menu-item .mi-icon svg { width: 15px; height: 15px; }
        .glass-menu-item:hover .mi-icon, .glass-menu-item:focus-visible .mi-icon {
          background: color-mix(in srgb, var(--apple-primary-foreground) 22%, transparent);
        }
        .glass-menu-item .mi-text { display: flex; flex-direction: column; line-height: 1.2; }
        .glass-menu-item .mi-sub {
          font-size: 10px; font-weight: 500; color: var(--apple-muted-foreground);
          transition: color 0.16s ease;
        }
        .glass-menu-item:hover .mi-sub, .glass-menu-item:focus-visible .mi-sub {
          color: color-mix(in srgb, var(--apple-primary-foreground) 74%, transparent);
        }
        .glass-menu-item .mi-trail { margin-left: auto; width: 14px; height: 14px; opacity: 0.55; }
        .glass-divider {
          height: 1px; margin: calc(var(--spacing) * 1) calc(var(--spacing) * 2);
          background: color-mix(in srgb, var(--apple-border) 55%, transparent); border: 0;
        }
        .glass-chip {
          display: inline-flex; align-items: center; gap: calc(var(--spacing) * 1.5);
          height: 26px; padding: 0 calc(var(--spacing) * 2.5);
          font-size: 11px; font-weight: 600; color: var(--apple-foreground); white-space: nowrap;
        }
        .chip-dot {
          width: 7px; height: 7px; border-radius: 999px; background: var(--apple-success);
          box-shadow: 0 0 6px color-mix(in srgb, var(--apple-success) 80%, transparent);
        }
        .glass-focusable:focus-visible { outline: 2px solid var(--apple-ring); outline-offset: 2px; }
        @keyframes panel-emerge {
          from { opacity: 0; transform: translateY(10px) scale(0.94); filter: blur(6px); }
          to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        .glass-emerge { animation: panel-emerge 0.34s cubic-bezier(0.2, 0.9, 0.3, 1.1) both; }

        /* ========== whale-dock ========== */
        .whale-dock { position: absolute; inset: 0; }
        .whale-shadow-pool {
          position: absolute; left: 50%; bottom: -10px; width: 216px; height: 42px;
          transform: translateX(-50%); border-radius: 50%;
          background: color-mix(in srgb, var(--apple-primary) 26%, transparent);
          filter: blur(18px);
          animation: whale-shadow 4.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        }
        .whale-figure {
          position: absolute; left: 0; right: 0; bottom: 0; margin: 0;
          display: flex; justify-content: center; transform-origin: 50% 100%;
          animation: whale-float 4.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        }
        .whale-figure img {
          height: 440px; width: auto; max-width: none; display: block;
          user-select: none; -webkit-user-drag: none;
        }
        .whale-dock[data-whale-state="engaged"] .whale-figure {
          animation-play-state: paused; transform: translateY(-6px);
        }
        .whale-dock[data-whale-state="engaged"] .whale-shadow-pool {
          animation-play-state: paused; transform: translateX(-50%) scale(0.93); opacity: 0.75;
        }
        @keyframes whale-float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-6px); }
        }
        @keyframes whale-shadow {
          0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.9; }
          50% { transform: translateX(-50%) scale(0.93); opacity: 0.72; }
        }
        .whale-hotspot {
          position: absolute; left: 50%; bottom: 0; width: 240px; height: 420px;
          transform: translateX(-50%); padding: 0; border: 0;
          border-radius: 46% 46% 42% 42%; background: transparent;
          cursor: pointer; appearance: none;
        }
        .whale-hotspot:focus-visible { outline: 2px solid var(--apple-ring); outline-offset: 4px; }
        .whale-status-chip { position: absolute; top: 4%; right: -4%; z-index: 2; }
        .whale-overlay { position: absolute; inset: 0; pointer-events: none; }
        .whale-overlay > * { pointer-events: auto; }

        @media (prefers-reduced-motion: reduce) {
          .whale-figure, .whale-shadow-pool, .glass-emerge, .idle-hint { animation: none; }
        }

        /* ========== 本页私有：idle-state-hint-caption ========== */
        .idle-hint {
          position: absolute; left: 50%; bottom: calc(100% - 14px);
          transform: translateX(-50%);
          animation: hint-breathe 3.2s ease-in-out infinite;
        }
        @keyframes hint-breathe {
          0%, 100% { opacity: 0.66; transform: translateX(-50%) translateY(0); }
          50% { opacity: 1; transform: translateX(-50%) translateY(-4px); }
        }
        .idle-hint [data-icon] { width: 13px; height: 13px; }
      </style>

      <!-- @region: desktop-stage-root-frame -->
      <div class="desktop-stage" data-stage="dsweber-desktop-pet">

        <!-- @region: desktop-wallpaper-layer -->
        <div class="desktop-wallpaper" aria-hidden="true"></div>

        <!-- @region: desktop-shortcut-column -->
        <ul class="desktop-shortcuts" aria-label="桌面快捷方式">
          <li class="desktop-shortcut">
            <span class="sc-icon"><span data-icon style="-webkit-mask-image: url('../assets/icons/dl_builtin_apple/folder.svg'); mask-image: url('../assets/icons/dl_builtin_apple/folder.svg');"></span></span>
            <span class="sc-label">项目文件夹</span>
          </li>
          <li class="desktop-shortcut">
            <span class="sc-icon"><span data-icon style="-webkit-mask-image: url('../assets/icons/dl_builtin_apple/file.svg'); mask-image: url('../assets/icons/dl_builtin_apple/file.svg');"></span></span>
            <span class="sc-label">设计文档</span>
          </li>
          <li class="desktop-shortcut">
            <span class="sc-icon"><span data-icon style="-webkit-mask-image: url('../assets/icons/dl_builtin_apple/trash-2.svg'); mask-image: url('../assets/icons/dl_builtin_apple/trash-2.svg');"></span></span>
            <span class="sc-label">回收站</span>
          </li>
        </ul>

        <!-- @region: taskbar-chrome -->
        <div class="taskbar-chrome" aria-hidden="true">
          <div class="taskbar-pill glass-surface glass-capsule">
            <span class="taskbar-app"><span data-icon style="-webkit-mask-image: url('../assets/icons/dl_builtin_apple/house.svg'); mask-image: url('../assets/icons/dl_builtin_apple/house.svg');"></span></span>
            <span class="taskbar-app"><span data-icon style="-webkit-mask-image: url('../assets/icons/dl_builtin_apple/folder-open.svg'); mask-image: url('../assets/icons/dl_builtin_apple/folder-open.svg');"></span></span>
            <span class="taskbar-app" data-active="true"><span data-icon style="-webkit-mask-image: url('../assets/icons/dl_builtin_apple/send-horizontal.svg'); mask-image: url('../assets/icons/dl_builtin_apple/send-horizontal.svg');"></span></span>
            <span class="taskbar-app"><span data-icon style="-webkit-mask-image: url('../assets/icons/dl_builtin_apple/user.svg'); mask-image: url('../assets/icons/dl_builtin_apple/user.svg');"></span></span>
          </div>
        </div>

        <!-- @region: tray-cluster / @slot: trayActiveState -->
        <div class="tray-cluster glass-surface glass-capsule" aria-hidden="true">
          <span class="tray-item"><span data-icon style="-webkit-mask-image: url('../assets/icons/dl_builtin_apple/chevron-up.svg'); mask-image: url('../assets/icons/dl_builtin_apple/chevron-up.svg');"></span></span>
          <span class="tray-item" data-active="true">
            <span data-icon style="-webkit-mask-image: url('../assets/icons/dl_builtin_apple/circle-check.svg'); mask-image: url('../assets/icons/dl_builtin_apple/circle-check.svg');"></span>
            <span>已连接</span>
          </span>
          <span class="tray-time">21:30<br>2026/9/20</span>
        </div>

        <!-- @slot: whaleDock —— 源自 partials/whale-dock.html -->
        <div class="whale-dock-slot" data-slot="whaleDock">
          <!-- @region: whale-anchor-rail / @slot: whaleStateClass -->
          <div class="whale-dock" data-whale-state="idle">

            <!-- @region: whale-shadow-pool -->
            <div class="whale-shadow-pool" aria-hidden="true"></div>

            <!-- @region: whale-mascot-figure -->
            <figure class="whale-figure">
              <img src="../assets/whale-mascot.png" alt="DSWeber 鲸鱼挂件" width="664" height="1024" draggable="false">
            </figure>

            <!-- @region: whale-hover-hotspot -->
            <button id="whale-mascot-hotspot" class="whale-hotspot" type="button"
                    aria-label="鲸鱼挂件：悬停展开快捷菜单，点击查看余额"></button>

            <!-- @region: whale-connection-status-chip -->
            <span class="whale-status-chip glass-surface glass-capsule glass-chip">
              <i class="chip-dot" aria-hidden="true"></i>已连接
            </span>

            <!-- @slot: overlayLayer（idle 页私有：idle-state-hint-caption） -->
            <div class="whale-overlay" data-slot="overlayLayer">
              <!-- @region: idle-state-hint-caption -->
              <span class="idle-hint glass-surface glass-capsule glass-chip">
                <span data-icon style="-webkit-mask-image: url('../assets/icons/dl_builtin_apple/mouse-pointer-click.svg'); mask-image: url('../assets/icons/dl_builtin_apple/mouse-pointer-click.svg');"></span>
                悬停鲸鱼 · 唤起快捷菜单
              </span>
            </div>

          </div>
        </div>

        <!-- @slot: overlayLayer（舞台级浮层，idle 页留空） -->
        <div class="stage-overlay" data-slot="overlayLayer"></div>

      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
